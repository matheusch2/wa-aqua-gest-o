<!DOCTYPE html>
<!--
  WA Aqua Gestão — Copyright © 2026 Matheus. Todos os direitos reservados.

  PONTE. Este arquivo não é uma tela: ele só reencaminha para /app/login.html.

  Por que existe: até 21/08/2026 o sistema morava na raiz do site, e o login
  ficava aqui. Muita gente salvou ESTE endereço na tela inicial do celular ou
  nos favoritos. Quando o app mudou para /app, este arquivo passou a existir
  para que esses atalhos continuem funcionando.

  NÃO APAGUE. Um cliente com o atalho antigo cairia numa página de erro, sem
  entender por quê — e ligaria achando que o sistema saiu do ar.

  A parte depois do "#" é preservada de propósito: os links de recuperação de
  senha do Supabase carregam o token ali. Perder isso é o cliente clicar no
  e-mail de "esqueci minha senha" e a recuperação simplesmente não funcionar.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#066b63">
<meta name="robots" content="noindex">
<title>WA Aqua Gestão</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #f3f6f5; color: #6b7280; text-align: center; padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  a { color: rgb(6,107,99); font-weight: 700; }
</style>
<script>
  // replace() e não href: o endereço antigo não deve ficar no histórico, senão
  // o botão Voltar joga a pessoa de volta aqui, num laço.
  (function () {
    var destino = "/app/login.html" + window.location.search + window.location.hash;
    window.location.replace(destino);
  })();
</script>
</head>
<body>
  <p>Levando você para o sistema…<br><br>
     <a href="/app/login.html">Se não abrir sozinho, toque aqui</a></p>
</body>
</html>
