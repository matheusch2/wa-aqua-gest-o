<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
    <meta name="google" content="notranslate">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20260713">
    <link rel="icon" type="image/png" href="icon-512.png?v=20260713">
    <meta name="apple-mobile-web-app-title" content="WA Aqua">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#066b63">
    <link rel="manifest" href="manifest.json?v=20260713b">
    <link rel="stylesheet" href="style.css?v=20260718a">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>WA Aqua gestão</title>
    
</head>


    
<body class="notranslate">

    <div class="topo" style="display:none">
        <div class="topo-conteudo">
            <div class="topo-esquerda" onclick="voltarMenuGestao()" style="cursor:pointer">
                <button id="btn-voltar-topo" class="topo-voltar" style="display:none" title="Voltar" aria-label="Voltar" onclick="event.stopPropagation(); irParaTelaAnterior()">
                    <svg viewBox="0 0 24 24" class="topo-svg"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
                <div class="logo-circulo">
                  <img 
                    src="https://i.postimg.cc/SKrJmL6V/Design-sem-nome-(4).png"
                    class="logo-img"
                  >
                </div>
                <div class="topo-divisor"></div>
                <div class="topo-texto">
                    <h1>WA AQUA GESTÃO</h1>
                    <p>Gestão inteligente do seu cultivo</p>
                </div>
            </div>
            <div class="topo-direita">
                <div class="topo-usuario-wrap">
                    <button class="topo-icone topo-usuario-btn" onclick="abrirConfiguracoes()" title="Configurações">
                        <div id="avatar-topo" class="avatar-topo-circle">
                            <svg viewBox="0 0 24 24" class="topo-svg"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </div>
                        <svg viewBox="0 0 24 24" class="topo-svg topo-chevron"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="card-gestao" class="card">

        <div id="menuGestao" class="botoes-gestao">

            <!-- HOME (celular): resumo do cultivo + ações rápidas + módulos -->
            <div id="dash-resumo" class="dash-resumo"></div>

            <div class="menu-rotulo">Ações rápidas</div>
            <div class="acoes-rapidas">
                <button class="botao-gestao" onclick="mostrarListaViveiros()">
                    <svg class="btn-svg" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    Ver viveiros
                </button>
                <button class="botao-gestao" onclick="mostrarLancamentoRacao()">
                    <svg class="btn-svg" viewBox="0 0 24 24"><path d="M3 11h18M5 11a7 7 0 0 0 14 0"/><path d="M10 4c0 1.5-1 2.5-1 4h6c0-1.5-1-2.5-1-4"/></svg>
                    Lançar ração
                </button>
                <button class="botao-gestao" onclick="abrirBiometriaRapida()">
                    <svg class="btn-svg" viewBox="0 0 24 24"><path d="M12 3v18M5 7l7-4 7 4M5 17l7 4 7-4"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="16" y2="14"/></svg>
                    Biometria
                </button>
                <button class="botao-gestao" onclick="abrirSimularVenda()">
                    <svg class="btn-svg" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/><polyline points="3 17 9 11 13 15 21 7"/></svg>
                    Simular venda
                </button>
            </div>

            <div class="menu-rotulo">Módulos</div>
            <div class="menu-modulos cfg-lista">
                <button class="cfg-item" onclick="mostrarCadastroViveiro()">
                    <div class="cfg-item-ico"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="9" rx="9" ry="4"/><path d="M3 9v5c0 2.2 4 4 9 4s9-1.8 9-4V9"/></svg></div>
                    <div class="cfg-item-texto"><span class="cfg-item-titulo">Cadastrar viveiro</span><span class="cfg-item-sub">Novo viveiro ou preparação</span></div>
                    <svg class="cfg-item-chevron" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
                <button class="cfg-item" onclick="abrirRacoesCatalogo()">
                    <div class="cfg-item-ico"><svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></div>
                    <div class="cfg-item-texto"><span class="cfg-item-titulo">Rações</span><span class="cfg-item-sub">Catálogo e preços</span></div>
                    <svg class="cfg-item-chevron" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
                <button class="cfg-item" onclick="mostrarHistoricoCultivo()">
                    <div class="cfg-item-ico"><svg viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="13" y2="15"/></svg></div>
                    <div class="cfg-item-texto"><span class="cfg-item-titulo">Histórico</span><span class="cfg-item-sub">Ração, biometria e despescas</span></div>
                    <svg class="cfg-item-chevron" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
                <button class="cfg-item" onclick="mostrarHistoricoCiclos()">
                    <div class="cfg-item-ico"><svg viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></div>
                    <div class="cfg-item-texto"><span class="cfg-item-titulo">Histórico de ciclos</span><span class="cfg-item-sub">Ciclos encerrados</span></div>
                    <svg class="cfg-item-chevron" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
                <button class="cfg-item" onclick="abrirMenuFinanceiro()">
                    <div class="cfg-item-ico"><svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
                    <div class="cfg-item-texto"><span class="cfg-item-titulo">Financeiro</span><span class="cfg-item-sub">Custos, boletos e relatórios</span></div>
                    <svg class="cfg-item-chevron" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
                <button class="cfg-item" onclick="abrirCustosInsumos()">
                    <div class="cfg-item-ico"><svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg></div>
                    <div class="cfg-item-texto"><span class="cfg-item-titulo">Insumos</span><span class="cfg-item-sub">Produtos e custos do cultivo</span></div>
                    <svg class="cfg-item-chevron" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
                <button class="cfg-item" onclick="abrirAssinatura()">
                    <div class="cfg-item-ico"><svg viewBox="0 0 24 24"><path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3-5.5-3-5.5 3 1-6.3L3 8.9 9 8z"/></svg></div>
                    <div class="cfg-item-texto"><span class="cfg-item-titulo">Meu plano</span><span class="cfg-item-sub">Assinatura e viveiros liberados</span></div>
                    <svg class="cfg-item-chevron" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
            </div>

            <!-- SIDEBAR (computador): menu clássico completo -->
            <div class="menu-desktop">
                <button class="botao-gestao" onclick="mostrarCadastroViveiro()">
                    <svg class="btn-svg" viewBox="0 0 24 24"><ellipse cx="12" cy="9" rx="9" ry="4"/><path d="M3 9v5c0 2.2 4 4 9 4s9-1.8 9-4V9"/></svg>
                    Cadastrar viveiro
                </button>
                <button class="botao-gestao" onclick="mostrarListaViveiros()">
                    <svg class="btn-svg" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    Ver viveiros
                </button>
                <button class="botao-gestao" onclick="mostrarLancamentoRacao()">
                    <svg class="btn-svg" viewBox="0 0 24 24"><path d="M3 11h18M5 11a7 7 0 0 0 14 0"/><path d="M10 4c0 1.5-1 2.5-1 4h6c0-1.5-1-2.5-1-4"/></svg>
                    Lançar ração
                </button>
                <button class="botao-gestao" onclick="abrirRacoesCatalogo()">
                    <svg class="btn-svg" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                    Rações
                </button>
                <button class="botao-gestao" onclick="mostrarHistoricoCultivo()">
                    <svg class="btn-svg" viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="13" y2="15"/></svg>
                    Histórico
                </button>
                <button class="botao-gestao" onclick="mostrarHistoricoCiclos()">
                    <svg class="btn-svg" viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                    Histórico de ciclos
                </button>
                <button class="botao-gestao" onclick="abrirMenuFinanceiro()">
                    <svg class="btn-svg" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                    Financeiro
                </button>
                <button class="botao-gestao" onclick="abrirCustosInsumos()">
                    <svg class="btn-svg" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
                    Insumos
                </button>
                <button class="botao-gestao" onclick="abrirSimularVenda()">
                    <svg class="btn-svg" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/><polyline points="3 17 9 11 13 15 21 7"/></svg>
                    Simular venda
                </button>
                <button class="botao-gestao" onclick="abrirAssinatura()">
                    <svg class="btn-svg" viewBox="0 0 24 24"><path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3-5.5-3-5.5 3 1-6.3L3 8.9 9 8z"/></svg>
                    Meu plano
                </button>
            </div>

        </div>

        <div id="area-gestao" class="resultado"></div>


    </div>

    <!-- Menu "+" da barra inferior: ações de lançamento -->
    <div id="sheet-lancar" class="sheet-overlay" style="display:none" onclick="if (event.target === this) _toggleSheetLancar(false)">
        <div class="sheet-card">
            <div class="sheet-alca"></div>
            <h4 class="sheet-titulo">O que você quer lançar?</h4>
            <button class="sheet-item" onclick="_sheetIr(mostrarLancamentoRacao)">
                <div class="sheet-item-ico"><svg viewBox="0 0 24 24"><path d="M3 11h18M5 11a7 7 0 0 0 14 0"/><path d="M10 4c0 1.5-1 2.5-1 4h6c0-1.5-1-2.5-1-4"/></svg></div>
                <div class="sheet-item-texto"><strong>Ração</strong><span>Lançamento diário de ração</span></div>
            </button>
            <button class="sheet-item" onclick="_sheetIr(abrirBiometriaRapida)">
                <div class="sheet-item-ico"><svg viewBox="0 0 24 24"><path d="M12 3v18M5 7l7-4 7 4M5 17l7 4 7-4"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="16" y2="14"/></svg></div>
                <div class="sheet-item-texto"><strong>Biometria</strong><span>Peso médio do camarão</span></div>
            </button>
            <button class="sheet-item" onclick="_sheetIr(abrirCustosInsumos)">
                <div class="sheet-item-ico"><svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg></div>
                <div class="sheet-item-texto"><strong>Insumo / custo</strong><span>Produtos e outros custos</span></div>
            </button>
            <button class="sheet-item" onclick="_sheetIr(mostrarCadastroViveiro)">
                <div class="sheet-item-ico"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="9" rx="9" ry="4"/><path d="M3 9v5c0 2.2 4 4 9 4s9-1.8 9-4V9"/></svg></div>
                <div class="sheet-item-texto"><strong>Novo viveiro</strong><span>Cadastrar viveiro ou preparação</span></div>
            </button>
        </div>
    </div>

    <!-- Barra de navegação inferior (celular) -->
    <nav id="nav-inferior" style="display:none">
        <button class="nav-item ativo" data-nav="inicio" onclick="voltarMenuGestao()">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Início</span>
        </button>
        <button class="nav-item" data-nav="viveiros" onclick="mostrarListaViveiros()">
            <svg viewBox="0 0 24 24"><ellipse cx="12" cy="9" rx="9" ry="4"/><path d="M3 9v5c0 2.2 4 4 9 4s9-1.8 9-4V9"/></svg>
            <span>Viveiros</span>
        </button>
        <button class="nav-mais" onclick="_toggleSheetLancar(true)" title="Lançar" aria-label="Lançar">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button class="nav-item" data-nav="financeiro" onclick="abrirMenuFinanceiro()">
            <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            <span>Financeiro</span>
        </button>
        <button class="nav-item" data-nav="mais" onclick="abrirMenuMais()">
            <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
            <span>Mais</span>
        </button>
    </nav>

    <script src="script.js?v=20260718a"></script>

</body>
</html>
