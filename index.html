<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>WA Aqua gestão</title>
    
</head>


    
<body>

    <div class="topo" style="display:none">
        <div class="topo-conteudo">
            <div class="topo-esquerda" onclick="voltarMenuGestao()" style="cursor:pointer">
                <div class="logo-circulo">
                  <img 
                    src="https://i.postimg.cc/SKrJmL6V/Design-sem-nome-(4).png"
                    class="logo-img"
                  >
                </div>
                <div class="topo-divisor"></div>
                <div class="topo-texto">
                    <h1>WA AQUA GESTÃO</h1>
                    <p>Gestão inteligente do seu cultivo</p>
                </div>
            </div>
            <div class="topo-direita">
                <div class="topo-usuario-wrap">
                    <button class="topo-icone topo-usuario-btn" onclick="toggleMenuUsuario()">
                        <div id="avatar-topo" class="avatar-topo-circle">
                            <svg viewBox="0 0 24 24" class="topo-svg"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </div>
                        <svg viewBox="0 0 24 24" class="topo-svg topo-chevron"><polyline points="6 9 12 15 18 9"/></svg>
                    </button>

                    <div id="menu-usuario" class="dropdown-usuario">

                        <!-- Header do usuário -->
                        <div class="menu-user-header">
                            <div class="menu-avatar-wrap" onclick="abrirOpcoesFoto()">
                                <div id="menu-avatar" class="menu-avatar-circle">
                                    <svg viewBox="0 0 24 24" style="width:28px;height:28px;stroke:white;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                                </div>
                                <div class="menu-avatar-edit">📷</div>
                            </div>
                            <div class="menu-user-info">
                                <span id="menu-usuario-nome" class="menu-user-nome">—</span>
                                <span id="menu-usuario-email" class="menu-user-email">—</span>
                                <span class="menu-online-badge">● Online</span>
                            </div>
                        </div>

                        <!-- Opções de foto (oculto por padrão) -->
                        <div id="menu-foto-opcoes" style="display:none" class="menu-foto-opcoes">
                            <label class="menu-foto-btn">
                                📷 Alterar foto
                                <input type="file" accept="image/*" onchange="uploadFotoPerfil(this)" style="display:none">
                            </label>
                            <button class="menu-foto-btn menu-foto-excluir" onclick="excluirFotoPerfil()">🗑️ Excluir foto</button>
                        </div>

                        <div class="menu-divider"></div>

                        <!-- Itens do menu -->
                        <button class="menu-item" onclick="abrirPerfilUsuario()">
                            <div class="menu-item-icone">
                                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            </div>
                            <div class="menu-item-texto">
                                <span>Perfil</span>
                                <small>Alterar nome da fazenda</small>
                            </div>
                            <div class="menu-item-chevron">›</div>
                        </button>

                        <button class="menu-item" onclick="abrirSegurancaUsuario()">
                            <div class="menu-item-icone">
                                <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                            </div>
                            <div class="menu-item-texto">
                                <span>Segurança</span>
                                <small>Alterar senha</small>
                            </div>
                            <div class="menu-item-chevron">›</div>
                        </button>

                        <button class="menu-item menu-item-aparencia" onclick="toggleTema()">
                            <div class="menu-item-icone">
                                <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                            </div>
                            <div class="menu-item-texto">
                                <span>Aparência</span>
                                <small>Tema claro ou escuro</small>
                            </div>
                            <div class="menu-tema-toggle" id="tema-toggle">
                                <div class="menu-tema-bolinha"></div>
                            </div>
                        </button>

                        <div class="menu-divider"></div>

                        <button class="menu-item menu-item-inativo">
                            <div class="menu-item-icone">
                                <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
                            </div>
                            <div class="menu-item-texto">
                                <span>Minha conta</span>
                                <small>Data de cadastro e plano atual</small>
                            </div>
                            <div class="menu-item-chevron">›</div>
                        </button>

                        <button class="menu-item menu-item-inativo">
                            <div class="menu-item-icone">
                                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                            </div>
                            <div class="menu-item-texto">
                                <span>Ajuda</span>
                                <small>Central de ajuda e dúvidas</small>
                            </div>
                            <div class="menu-item-chevron">›</div>
                        </button>

                        <button class="menu-item menu-item-inativo">
                            <div class="menu-item-icone">
                                <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                            </div>
                            <div class="menu-item-texto">
                                <span>Suporte</span>
                                <small>Fale com nossa equipe</small>
                            </div>
                            <div class="menu-item-chevron">›</div>
                        </button>

                        <div class="menu-divider"></div>

                        <button class="menu-item menu-item-sair" onclick="sairUsuario()">
                            <div class="menu-item-icone menu-item-icone-sair">
                                <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                            </div>
                            <div class="menu-item-texto">
                                <span>Sair da conta</span>
                                <small>Encerrar sessão atual</small>
                            </div>
                        </button>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="card-gestao" class="card">

        <div id="menuGestao" class="botoes-gestao">

            <button class="botao-gestao" onclick="mostrarCadastroViveiro()">
                <svg class="btn-svg" viewBox="0 0 24 24"><ellipse cx="12" cy="9" rx="9" ry="4"/><path d="M3 9v5c0 2.2 4 4 9 4s9-1.8 9-4V9"/></svg>
                Cadastrar viveiro
            </button>

            <button class="botao-gestao" onclick="mostrarListaViveiros()">
                <svg class="btn-svg" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                Ver viveiros
            </button>

            <button class="botao-gestao" onclick="mostrarLancamentoRacao()">
                <svg class="btn-svg" viewBox="0 0 24 24"><path d="M3 11h18M5 11a7 7 0 0 0 14 0"/><path d="M10 4c0 1.5-1 2.5-1 4h6c0-1.5-1-2.5-1-4"/></svg>
                Lançar ração
            </button>

            <button class="botao-gestao" onclick="mostrarHistoricoCultivo()">
                <svg class="btn-svg" viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="13" y2="15"/></svg>
                Histórico
            </button>

            <button class="botao-gestao" onclick="mostrarHistoricoCiclos()">
                <svg class="btn-svg" viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                Histórico de ciclos
            </button>

            <button class="botao-gestao" onclick="abrirFinanceiro()">
                <svg class="btn-svg" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                Financeiro
            </button>

            <button class="botao-gestao" onclick="abrirCustosInsumos()">
                <svg class="btn-svg" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
                Insumos
            </button>

        </div>

        <div id="area-gestao" class="resultado"></div>


    </div>

    <script src="script.js"></script

</body>
</html>
