<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>wa aqua</title>
</head>

            <button class="botao-gestao" onclick="mostrarCadastroViveiro()">
                Cadastrar viveiro
            </button>

            <button class="botao-gestao" onclick="mostrarListaViveiros()">
                Ver viveiros
            </button>

            <button class="botao-gestao" onclick="mostrarLancamentoRacao()">

            </button>

            <button class="botao-gestao" onclick="mostrarHistoricoCiclos()">
                Histórico de ciclos
            </button>

            <button class="botao-gestao" onclick="abrirFinanceiro()">
                Financeiro
            </button>

        </div>

        <div id="area-gestao" class="resultado"></div>

        <button id="botao-sair" class="botao-sair" onclick="sairUsuario()" style="display:none">
            Sair da conta
        </button>

    </div>

    <script src="script.js"></script>
