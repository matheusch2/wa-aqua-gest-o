<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
    <meta charset="utf-8">
    <meta name="google" content="notranslate">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#066b63">
    <title>WA Aqua — Administração</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --verde: #066b63; --verde-esc: #044b46; --verde-cl: #e3f2ef;
            --tinta: #16323c; --cinza: #7b8a92; --linha: #e6ecea; --fundo: #eef3f2;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--fundo); color: var(--tinta); min-height: 100vh; }

        /* ── Topo ── */
        .adm-topo { background: linear-gradient(135deg, var(--verde) 0%, var(--verde-esc) 100%); color: #fff; padding: 15px 18px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 20; box-shadow: 0 2px 14px rgba(2,44,40,.18); }
        .adm-topo-tit { display: flex; align-items: center; gap: 11px; }
        .adm-logo { width: 34px; height: 34px; border-radius: 9px; background: rgba(255,255,255,.16); display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .adm-topo h1 { font-size: 16px; font-weight: 800; letter-spacing: .3px; }
        .adm-topo small { display: block; font-size: 11px; opacity: .82; font-weight: 500; }
        .adm-sair { background: rgba(255,255,255,.16); color: #fff; border: none; border-radius: 10px; padding: 8px 15px; font-size: 13px; font-weight: 700; cursor: pointer; }
        .adm-sair:active { background: rgba(255,255,255,.28); }

        .adm-wrap { max-width: 820px; margin: 0 auto; padding: 16px 16px 60px; }

        /* ── Login ── */
        .adm-login { max-width: 380px; margin: 8vh auto 0; background: #fff; border-radius: 20px; padding: 30px 24px; box-shadow: 0 8px 34px rgba(2,44,40,.12); }
        .adm-login-logo { width: 58px; height: 58px; border-radius: 16px; background: var(--verde-cl); display: flex; align-items: center; justify-content: center; font-size: 30px; margin: 0 auto 14px; }
        .adm-login h2 { font-size: 19px; color: var(--verde); margin-bottom: 4px; text-align: center; }
        .adm-login p { font-size: 13px; color: var(--cinza); text-align: center; margin-bottom: 18px; }
        .adm-login label { display: block; font-size: 12.5px; font-weight: 700; color: #45565f; margin: 12px 0 5px; }
        .adm-login input { width: 100%; border: 1.5px solid #dde5e3; border-radius: 12px; padding: 13px; font-size: 15px; outline: none; }
        .adm-login input:focus { border-color: var(--verde); }
        .adm-entrar { width: 100%; margin-top: 18px; background: var(--verde); color: #fff; border: none; border-radius: 13px; padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; }
        .adm-entrar:disabled { opacity: .7; }
        .adm-msg { display: none; margin-top: 12px; text-align: center; font-size: 13px; font-weight: 600; color: #dc2626; }

        /* ── Título de seção ── */
        .sec-tit { font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--cinza); margin: 20px 2px 10px; }
        .sec-tit:first-child { margin-top: 6px; }

        /* ── Stat tiles ── */
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
        .stat { background: #fff; border: 1px solid var(--linha); border-radius: 15px; padding: 13px 12px; display: flex; flex-direction: column; gap: 3px; }
        .stat-ico { width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 15px; margin-bottom: 3px; }
        .stat-num { font-size: 21px; font-weight: 800; line-height: 1; color: var(--tinta); }
        .stat-num small { font-size: 12px; font-weight: 700; color: var(--cinza); }
        .stat-lbl { font-size: 11px; color: var(--cinza); font-weight: 600; }
        .i-verde { background: #d1fae5; } .i-azul { background: #dbeafe; } .i-ambar { background: #fef3c7; }
        .i-verm { background: #fee2e2; } .i-roxo { background: #ede9fe; } .i-cinza { background: #eef2f4; }

        /* ── Cartão de gráfico ── */
        .grafs { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; }
        @media (max-width: 620px) { .grafs { grid-template-columns: 1fr; } .stats { grid-template-columns: repeat(2, 1fr); } }
        .graf-card { background: #fff; border: 1px solid var(--linha); border-radius: 16px; padding: 15px 15px 10px; }
        .graf-card h3 { font-size: 13px; font-weight: 800; color: var(--tinta); margin-bottom: 12px; }
        .graf-box { position: relative; height: 168px; }
        .graf-legenda { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 10px; }
        .graf-legenda span { font-size: 11px; color: var(--cinza); font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .graf-legenda i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }

        /* ── Busca + filtros ── */
        .adm-busca { width: 100%; border: 1.5px solid #dde5e3; border-radius: 13px; padding: 12px 14px; font-size: 15px; outline: none; margin-bottom: 10px; background: #fff; }
        .adm-busca:focus { border-color: var(--verde); }
        .filtros { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; -webkit-overflow-scrolling: touch; }
        .filtro-chip { flex-shrink: 0; background: #fff; border: 1.5px solid var(--linha); color: #56666e; border-radius: 20px; padding: 7px 14px; font-size: 12.5px; font-weight: 700; cursor: pointer; white-space: nowrap; }
        .filtro-chip.ativo { background: var(--verde); border-color: var(--verde); color: #fff; }
        .adm-emails-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #fff; border: 1px solid var(--linha); border-radius: 12px; padding: 8px 12px; margin-bottom: 12px; }
        .adm-emails-bar span { font-size: 12.5px; color: var(--cinza); font-weight: 600; }
        .adm-emails-bar b { color: var(--tinta); }
        .adm-emails-btn { background: var(--verde-cl); color: var(--verde); border: none; border-radius: 9px; padding: 8px 14px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
        .adm-emails-btn:active { background: #cdeae3; }

        /* ── Cliente ── */
        .cli-card { background: #fff; border: 1px solid var(--linha); border-radius: 15px; margin-bottom: 10px; overflow: hidden; transition: box-shadow .15s; }
        .cli-card.aberto { box-shadow: 0 6px 22px rgba(2,44,40,.10); }
        .cli-cab { display: flex; align-items: center; gap: 11px; padding: 13px 14px; cursor: pointer; }
        .cli-avatar { position: relative; flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; background: var(--verde-cl); color: var(--verde); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; }
        .cli-dot { position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; }
        .dot-on { background: #22c55e; } .dot-mid { background: #f59e0b; } .dot-off { background: #cbd5e1; }
        .cli-info { flex: 1; min-width: 0; }
        .cli-nome { font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cli-email { font-size: 12px; color: var(--cinza); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cli-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
        .badge { font-size: 10.5px; font-weight: 700; border-radius: 20px; padding: 2.5px 9px; }
        .b-plano { background: var(--verde-cl); color: var(--verde); }
        .b-ativo { background: #d1fae5; color: #065f46; }
        .b-pend { background: #fef3c7; color: #92400e; }
        .b-canc { background: #fee2e2; color: #991b1b; }
        .b-venc-ok { background: #f1f5f9; color: #475569; }
        .b-venc-perto { background: #fef3c7; color: #92400e; }
        .b-vencido { background: #fee2e2; color: #991b1b; }
        .b-viv { background: #ede9fe; color: #5b21b6; }
        .cli-meta { display: flex; gap: 14px; margin-top: 7px; }
        .cli-meta span { font-size: 11px; color: var(--cinza); font-weight: 600; }
        .cli-meta b { color: #45565f; }
        .cli-seta { color: #b8c4c9; font-size: 20px; transition: transform .15s; }
        .cli-card.aberto .cli-seta { transform: rotate(90deg); }

        .cli-corpo { display: none; border-top: 1px solid #eef3f2; padding: 14px; background: #fafcfb; }
        .cli-card.aberto .cli-corpo { display: block; }
        .cli-linha { display: flex; gap: 8px; margin-bottom: 10px; }
        .cli-corpo select { flex: 1; border: 1.5px solid #dde5e3; border-radius: 10px; padding: 10px; font-size: 14px; background: #fff; outline: none; }
        .cli-acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .acao-btn { border: none; border-radius: 11px; padding: 11px 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
        .acao-btn:disabled { opacity: .6; }
        .a-liberar { background: var(--verde); color: #fff; grid-column: 1 / -1; }
        .a-trocar { background: #ede9fe; color: #5b21b6; }
        .a-bloquear { background: #fee2e2; color: #991b1b; }
        .a-reativar { background: #d1fae5; color: #065f46; }
        .a-hist { background: #f1f5f9; color: #334155; }

        /* Zona de perigo — excluir conta (discreto até confirmar) */
        .cli-perigo { margin-top: 12px; padding-top: 10px; border-top: 1px solid #eef3f2; }
        .cli-excluir-link { background: none; border: none; color: #b91c1c; font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 4px 2px; opacity: .85; }
        .cli-excluir-link:hover { text-decoration: underline; opacity: 1; }
        .cli-excluir-conf { margin-top: 8px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 11px; padding: 12px; }
        .cli-excluir-txt { font-size: 12.5px; color: #991b1b; line-height: 1.45; }
        .cli-excluir-txt b { font-weight: 800; }
        .cli-excluir-btns { display: flex; gap: 8px; margin-top: 10px; }
        .exc-cancelar { flex: 1; background: #fff; border: 1px solid #e5e7eb; border-radius: 9px; padding: 10px; font-weight: 700; font-size: 13px; cursor: pointer; color: #475569; }
        .exc-ok { flex: 1; background: #dc2626; border: none; border-radius: 9px; padding: 10px; font-weight: 700; font-size: 13px; cursor: pointer; color: #fff; }
        .exc-ok:disabled { opacity: .6; }

        .hist-lista { margin-top: 12px; border-top: 1px dashed #dde5e3; padding-top: 10px; }
        .hist-item { font-size: 12px; color: #45565f; padding: 6px 0; border-bottom: 1px solid #eef3f2; }
        .hist-item b { color: var(--verde); text-transform: capitalize; }
        .hist-item small { color: #94a3b8; display: block; }

        .adm-carregando { text-align: center; color: #94a3b8; padding: 40px 0; font-size: 14px; }
        .skel { height: 74px; background: linear-gradient(90deg,#fff 25%,#f3f7f6 50%,#fff 75%); background-size: 200% 100%; border: 1px solid var(--linha); border-radius: 15px; margin-bottom: 10px; animation: sk 1.2s infinite; }
        @keyframes sk { from { background-position: 200% 0; } to { background-position: -200% 0; } }

        .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--tinta); color: #fff; font-size: 13.5px; font-weight: 600; border-radius: 12px; padding: 12px 18px; z-index: 50; max-width: 90vw; text-align: center; animation: sobe .2s ease; }
        .toast.ok { background: #065f46; } .toast.erro { background: #991b1b; }
        @keyframes sobe { from { opacity: 0; transform: translate(-50%,10px); } to { opacity: 1; transform: translate(-50%,0); } }
    </style>
</head>
<body class="notranslate">

    <div id="tela-login" style="display:none">
        <div class="adm-login">
            <div class="adm-login-logo">🦐</div>
            <h2>WA Aqua · Administração</h2>
            <p>Acesso restrito ao administrador</p>
            <label>E-mail</label>
            <input type="email" id="adm-email" autocomplete="username" placeholder="admin@waaqua.com.br">
            <label>Senha</label>
            <input type="password" id="adm-senha" autocomplete="current-password" placeholder="Sua senha">
            <button class="adm-entrar" id="adm-btn-entrar" onclick="entrarAdmin()">Entrar</button>
            <div class="adm-msg" id="adm-msg"></div>
        </div>
    </div>

    <div id="tela-painel" style="display:none">
        <div class="adm-topo">
            <div class="adm-topo-tit">
                <div class="adm-logo">🦐</div>
                <div>
                    <h1>Administração <span style="font-size:10px;opacity:.6;font-weight:700">v6</span></h1>
                    <small id="adm-quem"></small>
                </div>
            </div>
            <button class="adm-sair" onclick="sairAdmin()">Sair</button>
        </div>
        <div class="adm-wrap">
            <div id="adm-dash">
                <div class="sec-tit">Visão geral</div>
                <div class="stats" id="adm-stats"></div>
                <div class="sec-tit">Crescimento</div>
                <div class="grafs">
                    <div class="graf-card"><h3>Novos usuários por mês</h3><div class="graf-box"><canvas id="graf-novos"></canvas></div></div>
                    <div class="graf-card"><h3>Distribuição de planos</h3><div class="graf-box"><canvas id="graf-planos"></canvas></div><div class="graf-legenda" id="graf-planos-leg"></div></div>
                </div>
            </div>
            <div class="sec-tit">Clientes</div>
            <input type="search" class="adm-busca" id="adm-busca" placeholder="Buscar por nome ou e-mail…" oninput="renderLista()">
            <div class="filtros" id="adm-filtros"></div>
            <div class="adm-emails-bar" id="adm-emails-bar" style="display:none">
                <span><b id="adm-emails-qtd">0</b> na seleção</span>
                <button class="adm-emails-btn" onclick="copiarEmails()">📋 Copiar e-mails</button>
            </div>
            <div id="adm-lista"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://bzlzjjodzyxvkakfmmxw.supabase.co";
        const SUPABASE_KEY = "sb_publishable_Avq19q531p8NrIRaHf5VvQ_DoWzOoaW";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const PLANOS = [
            { key: "gratis",        nome: "Grátis (1 viveiro)" },
            { key: "basico",        nome: "Básico (5 viveiros)" },
            { key: "intermediario", nome: "Intermediário (10 viveiros)" },
            { key: "avancado",      nome: "Avançado (20 viveiros)" },
            { key: "pro",           nome: "Pro (ilimitado)" },
        ];
        const NOME_PLANO = { gratis: "Grátis", basico: "Básico", intermediario: "Intermediário", avancado: "Avançado", pro: "Pro" };
        const COR_PLANO  = { gratis: "#94a3b8", basico: "#066b63", intermediario: "#2563eb", avancado: "#7c3aed", pro: "#d97706" };
        // Preços (espelham o app) para calcular MRR/ARR
        const PRECO_PLANO = {
            basico: { mensal: 50, anual: 500 }, intermediario: { mensal: 90, anual: 900 },
            avancado: { mensal: 160, anual: 1600 }, pro: { mensal: 250, anual: 2500 },
        };
        // Receita mensal recorrente de um cliente pagante (anual convertido p/ mês)
        function _mrrCliente(c) {
            if (!ehPagante(c)) return 0;
            const a = c.assinatura, p = PRECO_PLANO[a.plano];
            if (!p) return 0;
            return a.ciclo === "anual" ? p.anual / 12 : p.mensal;
        }
        const _rs0 = v => "R$ " + Math.round(v).toLocaleString("pt-BR");
        const FILTROS = [
            { key: "todos",    nome: "Todos" },
            { key: "ativos",   nome: "Ativos (7d)" },
            { key: "pagantes", nome: "Pagantes" },
            { key: "pendentes",nome: "Pendentes" },
            { key: "vencidos", nome: "Vencidos" },
            { key: "inativos", nome: "Inativos" },
        ];

        let clientes = [];
        let abertos = new Set();
        let _filtro = "todos";
        let _chartNovos = null, _chartPlanos = null;

        function toast(msg, tipo) {
            document.querySelectorAll(".toast").forEach(t => t.remove());
            const t = document.createElement("div");
            t.className = "toast " + (tipo || "");
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3200);
        }
        function msgLogin(m) { const el = document.getElementById("adm-msg"); el.textContent = m; el.style.display = "block"; }
        function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

        // ── Datas ──
        function _dias(dateStr) { // dias desde a data (ou null)
            if (!dateStr) return null;
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return null;
            return Math.floor((Date.now() - d.getTime()) / 86400000);
        }
        function relativo(dateStr) {
            const dd = _dias(dateStr);
            if (dd == null) return "nunca";
            if (dd <= 0) return "hoje";
            if (dd === 1) return "ontem";
            if (dd < 30) return `há ${dd} dias`;
            if (dd < 60) return "há 1 mês";
            if (dd < 365) return `há ${Math.floor(dd / 30)} meses`;
            return `há ${Math.floor(dd / 365)} ano(s)`;
        }
        function dotAtividade(dateStr) {
            const dd = _dias(dateStr);
            if (dd == null) return "dot-off";
            if (dd <= 7) return "dot-on";
            if (dd <= 30) return "dot-mid";
            return "dot-off";
        }
        function infoVencimento(a) {
            if (!a || !a.proximo_vencimento) return null;
            const m = String(a.proximo_vencimento).match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (!m) return null;
            const venc = new Date(+m[1], +m[2] - 1, +m[3]);
            const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
            const dias = Math.round((venc - hoje) / 86400000);
            const fmt = venc.toLocaleDateString("pt-BR");
            if (dias < 0) return { cls: "b-vencido", txt: `Vencido há ${-dias}d`, venc: true };
            if (dias === 0) return { cls: "b-venc-perto", txt: `Vence hoje`, venc: false };
            if (dias <= 7) return { cls: "b-venc-perto", txt: `Vence em ${dias}d`, venc: false };
            return { cls: "b-venc-ok", txt: `Vence ${fmt}`, venc: false };
        }
        function ehPagante(c) { const a = c.assinatura; return a && a.status === "ativo" && a.plano && a.plano !== "gratis"; }

        // ── Chamada às Edge Functions (tolera nome com/sem hífen final) ──
        const _slugOk = {};
        async function chamar(body, fn = "admin-clientes") {
            const slugs = _slugOk[fn] ? [_slugOk[fn]] : [fn + "-", fn];
            let erroDetalhado = null, ultimoErro = null;
            for (const slug of slugs) {
                try {
                    const { data, error } = await sb.functions.invoke(slug, { body });
                    if (error) {
                        const status = error.context && error.context.status;
                        if (status === 401 || status === 403) throw new Error("SEM_ACESSO");
                        let det = "";
                        try { det = (await error.context.json()).error || ""; } catch (e) {}
                        const err = new Error(det || `função "${slug}" → ${status ? "status " + status : (error.name || "sem resposta") + ": " + (error.message || "")}`);
                        if (det) err.temDetalhe = true;
                        throw err;
                    }
                    if (data && data.error) { const err = new Error(data.error); err.definitivo = true; throw err; }
                    _slugOk[fn] = slug;
                    return data;
                } catch (e) {
                    if (e.message === "SEM_ACESSO" || e.definitivo) throw e;
                    if (e.temDetalhe && !erroDetalhado) erroDetalhado = e;
                    ultimoErro = e;
                }
            }
            throw erroDetalhado || ultimoErro || new Error("Erro ao falar com o servidor.");
        }

        async function init() {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) { document.getElementById("tela-login").style.display = "block"; return; }
            entrarPainel(session);
        }

        async function entrarAdmin() {
            const btn = document.getElementById("adm-btn-entrar");
            if (btn.disabled) return;
            const email = document.getElementById("adm-email").value.trim();
            const senha = document.getElementById("adm-senha").value;
            if (!email || !senha) { msgLogin("Preencha e-mail e senha."); return; }
            btn.disabled = true; btn.textContent = "Entrando…";
            const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
            btn.disabled = false; btn.textContent = "Entrar";
            if (error) { msgLogin("E-mail ou senha incorretos."); return; }
            entrarPainel(data.session);
        }

        async function entrarPainel(session) {
            document.getElementById("tela-login").style.display = "none";
            document.getElementById("tela-painel").style.display = "block";
            document.getElementById("adm-quem").textContent = session.user.email;
            renderFiltros();
            try {
                await carregarClientes();
            } catch (e) {
                if (e.message === "SEM_ACESSO") {
                    document.getElementById("tela-painel").style.display = "none";
                    document.getElementById("tela-login").style.display = "block";
                    msgLogin("Esta conta não tem acesso administrativo.");
                    await sb.auth.signOut();
                } else {
                    document.getElementById("adm-lista").innerHTML = `<div class="adm-carregando">Erro: ${esc(e.message)}</div>`;
                }
            }
        }

        async function sairAdmin() { await sb.auth.signOut(); location.reload(); }

        async function carregarClientes() {
            const data = await chamar({ action: "listar" });
            clientes = data.clientes || [];
            renderDashboard();
            renderLista();
        }

        // ── Dashboard: stat tiles + gráficos ──
        function renderDashboard() {
            const total = clientes.length;
            const pagantes = clientes.filter(ehPagante).length;
            const pend = clientes.filter(c => c.assinatura && c.assinatura.status === "pendente").length;
            const vencidos = clientes.filter(c => { const v = infoVencimento(c.assinatura); return v && v.venc; }).length;
            const ativos7 = clientes.filter(c => { const d = _dias(c.ultimo_acesso); return d != null && d <= 7; }).length;
            const viveiros = clientes.reduce((s, c) => s + (c.viveiros || 0), 0);
            const lancamentos = clientes.reduce((s, c) => s + (c.lancamentos || 0), 0);
            const mrr = clientes.reduce((s, c) => s + _mrrCliente(c), 0);
            const ticket = pagantes > 0 ? mrr / pagantes : 0;

            const tile = (ico, cls, num, sub, lbl) =>
                `<div class="stat"><div class="stat-ico ${cls}">${ico}</div><div class="stat-num">${num}${sub ? `<small>${sub}</small>` : ""}</div><div class="stat-lbl">${lbl}</div></div>`;
            document.getElementById("adm-stats").innerHTML =
                tile("👥", "i-azul", total, "", "Clientes") +
                tile("🟢", "i-verde", ativos7, "", "Ativos (7 dias)") +
                tile("💳", "i-verde", pagantes, "", "Pagantes") +
                tile("💰", "i-verde", _rs0(mrr), "", "Receita/mês (MRR)") +
                tile("📅", "i-azul", _rs0(mrr * 12), "", "Receita/ano (ARR)") +
                tile("🎯", "i-roxo", _rs0(ticket), "", "Ticket médio") +
                tile("⏳", "i-ambar", pend, "", "Pendentes") +
                tile("⚠️", "i-verm", vencidos, "", "Vencidos") +
                tile("🦐", "i-roxo", viveiros, "", "Viveiros") +
                tile("📈", "i-cinza", lancamentos, "", "Lançamentos") +
                tile("📊", "i-cinza", total ? Math.round((pagantes / total) * 100) : 0, "%", "Conversão");

            // Gráfico 1 — novos usuários nos últimos 6 meses
            const meses = [], labels = [];
            const base = new Date(); base.setDate(1);
            for (let i = 5; i >= 0; i--) {
                const d = new Date(base.getFullYear(), base.getMonth() - i, 1);
                meses.push({ ano: d.getFullYear(), mes: d.getMonth(), n: 0 });
                labels.push(d.toLocaleDateString("pt-BR", { month: "short" }).replace(".", ""));
            }
            clientes.forEach(c => {
                if (!c.criado_em) return;
                const d = new Date(c.criado_em);
                const m = meses.find(x => x.ano === d.getFullYear() && x.mes === d.getMonth());
                if (m) m.n++;
            });
            if (_chartNovos) _chartNovos.destroy();
            _chartNovos = new Chart(document.getElementById("graf-novos"), {
                type: "bar",
                data: { labels, datasets: [{ data: meses.map(m => m.n), backgroundColor: "#066b63", borderRadius: 6, maxBarThickness: 34 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `${c.parsed.y} novo(s)` } } },
                    scales: { y: { beginAtZero: true, ticks: { precision: 0, color: "#94a3b8" }, grid: { color: "#eef3f2" } }, x: { ticks: { color: "#94a3b8" }, grid: { display: false } } } }
            });

            // Gráfico 2 — distribuição de planos
            const dist = {};
            clientes.forEach(c => { const p = (c.assinatura && c.assinatura.plano) || "gratis"; dist[p] = (dist[p] || 0) + 1; });
            const chaves = PLANOS.map(p => p.key).filter(k => dist[k]);
            if (_chartPlanos) _chartPlanos.destroy();
            _chartPlanos = new Chart(document.getElementById("graf-planos"), {
                type: "doughnut",
                data: { labels: chaves.map(k => NOME_PLANO[k]), datasets: [{ data: chaves.map(k => dist[k]), backgroundColor: chaves.map(k => COR_PLANO[k]), borderWidth: 2, borderColor: "#fff" }] },
                options: { responsive: true, maintainAspectRatio: false, cutout: "62%", plugins: { legend: { display: false } } }
            });
            document.getElementById("graf-planos-leg").innerHTML = chaves.length
                ? chaves.map(k => `<span><i style="background:${COR_PLANO[k]}"></i>${NOME_PLANO[k]} · ${dist[k]}</span>`).join("")
                : `<span style="color:#94a3b8">Sem dados</span>`;
        }

        // ── Filtros ──
        function renderFiltros() {
            document.getElementById("adm-filtros").innerHTML = FILTROS.map(f =>
                `<button class="filtro-chip ${f.key === _filtro ? "ativo" : ""}" onclick="setFiltro('${f.key}')">${f.nome}</button>`).join("");
        }
        function setFiltro(k) { _filtro = k; renderFiltros(); renderLista(); }

        function passaFiltro(c) {
            const a = c.assinatura, d = _dias(c.ultimo_acesso);
            switch (_filtro) {
                case "ativos":   return d != null && d <= 7;
                case "inativos": return d == null || d > 30;
                case "pagantes": return ehPagante(c);
                case "pendentes":return a && a.status === "pendente";
                case "vencidos": { const v = infoVencimento(a); return !!(v && v.venc); }
                default: return true;
            }
        }

        // ── Lista de clientes ──
        // Lista atualmente filtrada (usada pela lista e pela cópia de e-mails)
        function _clientesFiltrados() {
            const filtro = (document.getElementById("adm-busca").value || "").toLowerCase();
            return clientes.filter(c => passaFiltro(c) && (!filtro ||
                (c.nome || "").toLowerCase().includes(filtro) || (c.email || "").toLowerCase().includes(filtro)));
        }

        // Copia os e-mails dos clientes filtrados (ex.: filtro "Inativos")
        async function copiarEmails() {
            const emails = _clientesFiltrados().map(c => c.email).filter(Boolean);
            if (!emails.length) { toast("Nenhum e-mail nesta seleção."); return; }
            const txt = emails.join("; ");
            try {
                await navigator.clipboard.writeText(txt);
                toast(`${emails.length} e-mail(s) copiado(s) ✅`, "ok");
            } catch (e) {
                // Fallback: mostra pra copiar na mão
                prompt("Copie os e-mails:", txt);
            }
        }

        function renderLista() {
            const lista = _clientesFiltrados();
            const el = document.getElementById("adm-lista");
            document.getElementById("adm-emails-bar").style.display = lista.length ? "flex" : "none";
            document.getElementById("adm-emails-qtd").textContent = lista.length;
            if (!lista.length) { el.innerHTML = `<div class="adm-carregando">Nenhum cliente encontrado.</div>`; return; }
            el.innerHTML = lista.map(c => {
                const a = c.assinatura;
                const plano = a && a.plano ? a.plano : "gratis";
                const status = a ? a.status : "ativo";
                const stBadge = plano === "gratis" ? "" :
                    status === "ativo" ? `<span class="badge b-ativo">Ativo</span>` :
                    status === "pendente" ? `<span class="badge b-pend">Pendente</span>` :
                    `<span class="badge b-canc">Bloqueado</span>`;
                const v = infoVencimento(a);
                const ini = ((c.nome || c.email || "?").trim()[0] || "?").toUpperCase();
                const aberto = abertos.has(c.id);
                return `
                <div class="cli-card${aberto ? " aberto" : ""}" id="cli-${esc(c.id)}">
                    <div class="cli-cab" onclick="toggleCliente('${esc(c.id)}')">
                        <div class="cli-avatar">${esc(ini)}<span class="cli-dot ${dotAtividade(c.ultimo_acesso)}"></span></div>
                        <div class="cli-info">
                            <div class="cli-nome">${esc(c.nome || c.email)}</div>
                            ${c.nome ? `<div class="cli-email">${esc(c.email)}</div>` : ""}
                            <div class="cli-badges">
                                <span class="badge b-plano">${NOME_PLANO[plano] || esc(plano)}</span>
                                ${stBadge}
                                ${v ? `<span class="badge ${v.cls}">${v.txt}</span>` : ""}
                                <span class="badge b-viv">${c.viveiros} viveiro${c.viveiros === 1 ? "" : "s"}</span>
                            </div>
                            <div class="cli-meta">
                                <span>Último acesso: <b>${relativo(c.ultimo_acesso)}</b></span>
                                <span><b>${c.lancamentos || 0}</b> lançamentos</span>
                            </div>
                        </div>
                        <span class="cli-seta">›</span>
                    </div>
                    <div class="cli-corpo">
                        <div class="cli-linha">
                            <select id="plano-${esc(c.id)}">
                                ${PLANOS.map(p => `<option value="${p.key}" ${p.key === plano ? "selected" : ""}>${p.nome}</option>`).join("")}
                            </select>
                            <select id="ciclo-${esc(c.id)}">
                                <option value="mensal" ${a && a.ciclo === "anual" ? "" : "selected"}>Mensal (+30 dias)</option>
                                <option value="anual" ${a && a.ciclo === "anual" ? "selected" : ""}>Anual (+365 dias)</option>
                            </select>
                        </div>
                        <div class="cli-acoes">
                            <button class="acao-btn a-liberar" onclick="acao(this,'liberar','${esc(c.id)}')">💰 Registrar pagamento / Liberar</button>
                            <button class="acao-btn a-trocar" onclick="acao(this,'trocar','${esc(c.id)}')">Trocar plano</button>
                            <button class="acao-btn a-hist" onclick="verHistorico(this,'${esc(c.id)}')">Histórico</button>
                            <button class="acao-btn a-reativar" onclick="acao(this,'reativar','${esc(c.id)}')">Reativar</button>
                            <button class="acao-btn a-bloquear" onclick="acao(this,'bloquear','${esc(c.id)}')">Bloquear</button>
                        </div>
                        <div class="hist-lista" id="hist-${esc(c.id)}" style="display:none"></div>
                        <div class="cli-perigo">
                            <button class="cli-excluir-link" onclick="pedirExcluir('${esc(c.id)}')">Excluir conta e todos os dados</button>
                            <div class="cli-excluir-conf" id="exc-${esc(c.id)}" style="display:none">
                                <div class="cli-excluir-txt">⚠️ Isso apaga <b>a conta e todos os dados</b> deste cliente. Não tem volta.</div>
                                <div class="cli-excluir-btns">
                                    <button class="exc-cancelar" onclick="document.getElementById('exc-${esc(c.id)}').style.display='none'">Cancelar</button>
                                    <button class="exc-ok" onclick="excluirCliente(this,'${esc(c.id)}')">Sim, excluir tudo</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join("");
        }

        // Abre/fecha um card sem reconstruir a lista (preserva selects dos outros)
        function toggleCliente(id) {
            const card = document.getElementById("cli-" + id);
            if (!card) return;
            if (abertos.has(id)) { abertos.delete(id); card.classList.remove("aberto"); }
            else { abertos.add(id); card.classList.add("aberto"); }
        }

        async function acao(btn, tipo, alvo) {
            if (btn.disabled) return;
            const txt = btn.textContent;
            btn.disabled = true; btn.textContent = "Aguarde…";
            try {
                const body = { action: tipo, alvo };
                if (tipo === "liberar") { body.plano = document.getElementById("plano-" + alvo).value; body.ciclo = document.getElementById("ciclo-" + alvo).value; }
                else if (tipo === "trocar") { body.plano = document.getElementById("plano-" + alvo).value; }
                await chamar(body);
                await carregarClientes();
                toast(tipo === "liberar" ? "Pagamento registrado — plano liberado! ✅" :
                    tipo === "trocar" ? "Plano trocado." :
                    tipo === "bloquear" ? "Cliente bloqueado." : "Cliente reativado.",
                    tipo === "bloquear" ? "" : "ok");
            } catch (e) {
                toast(e.message === "SEM_ACESSO" ? "Sem permissão." : "Erro: " + e.message, "erro");
                btn.disabled = false; btn.textContent = txt;
            }
        }

        // Abre a confirmação de exclusão (painel inline discreto)
        function pedirExcluir(id) {
            const el = document.getElementById("exc-" + id);
            if (el) el.style.display = el.style.display === "none" ? "block" : "none";
        }

        // Exclusão definitiva (já confirmada pelo painel)
        async function excluirCliente(btn, alvo) {
            if (btn.disabled) return;
            btn.disabled = true; btn.textContent = "Excluindo…";
            try {
                await chamar({ alvo }, "excluir-conta");
                abertos.delete(alvo);
                await carregarClientes();
                toast("Conta excluída definitivamente.", "ok");
            } catch (e) {
                toast(e.message === "SEM_ACESSO" ? "Sem permissão." : "Erro: " + e.message, "erro");
                btn.disabled = false; btn.textContent = "Sim, excluir tudo";
            }
        }

        async function verHistorico(btn, alvo) {
            const box = document.getElementById("hist-" + alvo);
            if (box.style.display !== "none") { box.style.display = "none"; return; }
            box.style.display = "block";
            box.innerHTML = `<div class="hist-item">Carregando…</div>`;
            try {
                const data = await chamar({ action: "historico", alvo });
                const h = data.historico || [];
                box.innerHTML = h.length ? h.map(i => {
                    const d = new Date(i.criado_em).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" });
                    const det = i.detalhes && i.detalhes.plano ? ` — ${NOME_PLANO[i.detalhes.plano] || i.detalhes.plano}${i.detalhes.ciclo ? " · " + i.detalhes.ciclo : ""}${i.detalhes.vencimento ? " · vence " + i.detalhes.vencimento.split("-").reverse().join("/") : ""}` : "";
                    return `<div class="hist-item"><b>${esc(i.acao)}</b>${det}<small>${d}</small></div>`;
                }).join("") : `<div class="hist-item">Nenhum registro ainda.</div>`;
            } catch (e) {
                box.innerHTML = `<div class="hist-item">Erro ao carregar histórico.</div>`;
            }
        }

        document.getElementById("adm-senha").addEventListener("keydown", e => { if (e.key === "Enter") entrarAdmin(); });
        init();
    </script>
</body>
</html>
