<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Imprimir — WA Aqua Gestão</title>
<!--
  Página de impressão para quando o app está INSTALADO na tela de início.
  O iPhone não imprime de app instalado (não existe a barra de compartilhar
  nesse modo), então o relatório é mandado para cá, no Safari, onde imprime.

  O conteúdo chega pelo # da URL. Isso seria uma porta de XSS no domínio do
  app — um link forjado injetaria script com acesso ao login guardado. Por
  isso a CSP abaixo só permite executar ESTE script (pelo hash). Qualquer
  script que venha pela URL é bloqueado pelo navegador, mesmo que a limpeza
  abaixo deixe passar.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; script-src 'sha256-1FqcO4AduGMuuLYGUwzL4w9xWQExIAUBgeKIOGn2JWU='; base-uri 'none'; form-action 'none'">
<style>
  body { margin: 0; font-family: Arial, sans-serif; background: #fff; }
  #barra { display: flex; gap: 10px; align-items: center; padding: 12px 16px; background: #066b63; color: #fff; }
  #barra b { font-size: 15px; flex: 1; }
  #barra button { padding: 9px 16px; border: none; border-radius: 8px; background: #fff; color: #066b63; font-size: 14px; font-weight: 800; }
  #aviso { padding: 14px 16px; font-size: 13px; color: #92400e; background: #fffbeb; border-bottom: 1px solid #fcd34d; }
  @media print { #barra, #aviso { display: none !important; } }
</style>
</head>
<body>
<div id="barra"><b>Relatório pronto</b><button id="btn" type="button">Imprimir</button></div>
<div id="aviso">Se a impressão não abrir sozinha, toque em <b>Imprimir</b> acima.</div>
<div id="doc"></div>
<script>
(function () {
  var bruto = "";
  try { bruto = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  if (!bruto) { document.getElementById("doc").innerHTML = "<p style='padding:16px;font:14px Arial;color:#6b7280'>Nada para imprimir. Volte ao app e toque em imprimir de novo.</p>"; return; }

  // Cinto e suspensório: a CSP já impede executar qualquer script vindo da
  // URL, mas tirar o que é executável evita até o pedido de rede.
  var limpo = bruto
    .replace(/<script[\s\S]*?<\/script>/gi, "")
    .replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, "")
    .replace(/javascript:/gi, "");

  var estilos = (limpo.match(/<style[^>]*>[\s\S]*?<\/style>/gi) || []).join("\n");
  var mBody = limpo.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
  var corpo = mBody ? mBody[1] : limpo;

  document.getElementById("doc").innerHTML = estilos + corpo;

  var imprimir = function () { try { window.print(); } catch (e) {} };
  document.getElementById("btn").addEventListener("click", imprimir);
  setTimeout(imprimir, 500);
})();
</script>
</body>
</html>
